name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test deterministic scaffold
        run: python -m pytest --cov --cov-report=term-missing

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build plugin release artifact
        working-directory: apps/obsidian-hermes
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build
      - name: Verify lifecycle release assets are packaged
        run: |
          python -c "import zipfile; from pathlib import Path; wheel = next(Path('dist').glob('*.whl')); names = set(zipfile.ZipFile(wheel).namelist()); required = {'obsidian_hermes/lifecycle/assets/apps/obsidian-hermes/main.js', 'obsidian_hermes/lifecycle/assets/apps/obsidian-hermes/manifest.json', 'obsidian_hermes/lifecycle/assets/apps/obsidian-hermes/styles.css', 'obsidian_hermes/lifecycle/assets/reference-vault/README.md'}; missing = required - names; assert not missing, f'Missing lifecycle assets: {sorted(missing)}'"

  obsidian-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/obsidian-hermes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install plugin dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check and bundle plugin
        run: npm run build
